<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學校食堂預訂系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .theme-default { --primary: #059669; --primary-hover: #047857; }
        .theme-blue { --primary: #2563eb; --primary-hover: #1d4ed8; }
        .theme-purple { --primary: #7c3aed; --primary-hover: #6d28d9; }
        .theme-rose { --primary: #e11d48; --primary-hover: #be123c; }

        .bg-primary { background-color: var(--primary); }
        .bg-primary-hover:hover { background-color: var(--primary-hover); }
        .text-primary { color: var(--primary); }
        .border-primary { border-color: var(--primary); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans theme-default min-h-screen flex flex-col">

    <!-- Top Header Navigation -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-primary text-white p-2 rounded-lg text-xl shadow-sm">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h1 id="appTitle" class="text-xl font-bold text-slate-800 tracking-tight">學校食堂預訂系統</h1>
            </div>

            <!-- 控制選項 -->
            <div class="flex items-center space-x-3">
                <!-- 切換語言 -->
                <button onclick="toggleLanguage()" class="px-3 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 rounded-md transition text-slate-700 font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-globe"></i>
                    <span id="langBtnText">English</span>
                </button>
                <!-- 購物車數量提示 -->
                <div class="relative">
                    <button onclick="scrollToCart()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-md transition text-slate-700">
                        <i class="fa-solid fa-cart-shopping text-lg"></i>
                        <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6 w-full">
        
        <!-- 左側/上方：餐點清單與分類 (占 2 欄) -->
        <section class="lg:col-span-2 space-y-4">
            
            <!-- 分類切換按鈕 -->
            <div class="flex items-center space-x-2 overflow-x-auto pb-2 border-b border-slate-200" id="categoryContainer">
                <button onclick="filterCategory('all')" class="category-btn px-4 py-2 rounded-full text-sm font-semibold bg-primary text-white shadow-sm transition">全部菜單 (20)</button>
                <button onclick="filterCategory('main')" class="category-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition">經典主食</button>
                <button onclick="filterCategory('snack')" class="category-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition">小吃點心</button>
                <button onclick="filterCategory('drink')" class="category-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition">特色飲品</button>
            </div>

            <!-- 餐點列表網格 -->
            <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- 由 JavaScript 動態生成 20 項餐點 -->
            </div>
        </section>

        <!-- 右側/下方：購物車與結帳區 (占 1 欄) -->
        <section id="cartSection" class="space-y-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm sticky top-20">
                <h2 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-receipt mr-2 text-primary"></i>已選購餐點</span>
                    <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">清空購物車</button>
                </h2>

                <!-- 購物車清單 -->
                <div id="cartItems" class="divide-y divide-slate-100 my-4 max-h-80 overflow-y-auto space-y-2">
                    <p class="text-sm text-slate-400 text-center py-8">購物車是空的，快去挑選喜歡的餐點吧！</p>
                </div>

                <!-- 費用統計 -->
                <div class="border-t border-slate-200 pt-3 space-y-1.5 text-sm">
                    <div class="flex justify-between text-slate-600">
                        <span>小計</span>
                        <span>￥<span id="subtotalPrice">0</span></span>
                    </div>
                    <div class="flex justify-between font-bold text-base text-slate-800 pt-2 border-t border-dashed border-slate-200">
                        <span>總計金額</span>
                        <span class="text-primary text-xl">￥<span id="totalPrice">0</span></span>
                    </div>
                </div>

                <!-- 提交訂單按鈕 -->
                <button onclick="checkout()" class="w-full mt-5 py-3 bg-primary bg-primary-hover text-white font-bold rounded-lg shadow transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>立即提交預訂</span>
                </button>
            </div>
        </section>
    </main>

    <!-- 底部資訊 -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-4 text-center text-xs text-slate-400">
        <p>© 2026 學校食堂預訂系統 - 版權所有</p>
    </footer>

    <!-- JavaScript 邏輯區塊 -->
    <script>
        // 20 項完整菜單資料庫 (包含主食、小吃與飲料)
        const menuData = [
            // --- 經典主食 (8項) ---
            { id: 1, name: '海南雞飯', category: 'main', price: 22, stock: 20, icon: 'fa-drumstick-bite' },
            { id: 2, name: '日式牛肉咖哩飯', category: 'main', price: 24, stock: 15, icon: 'fa-bowl-rice' },
            { id: 3, name: '經典義大利肉醬麵', category: 'main', price: 20, stock: 18, icon: 'fa-utensils' },
            { id: 4, name: '韓式泡菜豬肉飯', category: 'main', price: 22, stock: 12, icon: 'fa-pepper-hot' },
            { id: 5, name: '香煎雞腿排便當', category: 'main', price: 25, stock: 25, icon: 'fa-box' },
            { id: 6, name: '廣式叉燒燒鴨雙拼飯', category: 'main', price: 26, stock: 10, icon: 'fa-bowl-food' },
            { id: 7, name: '蕃茄牛肉燉飯', category: 'main', price: 23, stock: 14, icon: 'fa-plate-wheat' },
            { id: 8, name: '蔬食素炒麵', category: 'main', price: 16, stock: 20, icon: 'fa-seedling' },

            // --- 小吃點心 (6項) ---
            { id: 9, name: '黃金香酥雞塊 (6塊)', category: 'snack', price: 12, stock: 30, icon: 'fa-cookie' },
            { id: 10, name: '美式黃金薯條', category: 'snack', price: 10, stock: 30, icon: 'fa-cubes' },
            { id: 11, name: '章魚燒 (6顆)', category: 'snack', price: 15, stock: 20, icon: 'fa-circle' },
            { id: 12, name: '日式煎餃 (5顆)', category: 'snack', price: 12, stock: 25, icon: 'fa-dumpling' },
            { id: 13, name: '香濃起司熱狗棒', category: 'snack', price: 9, stock: 20, icon: 'fa-hotdog' },
            { id: 14, name: '黑糖珍珠蛋塔', category: 'snack', price: 8, stock: 15, icon: 'fa-bread-slice' },

            // --- 特色飲品 (6項) ---
            { id: 15, name: '寶礦力水得 (500ml)', category: 'drink', price: 5, stock: 50, icon: 'fa-bottle-water' },
            { id: 16, name: '經典台式珍珠奶茶', category: 'drink', price: 12, stock: 30, icon: 'fa-glass-water' },
            { id: 17, name: '鮮榨檸檬紅茶', category: 'drink', price: 8, stock: 40, icon: 'fa-lemon' },
            { id: 18, name: '巧克力牛奶', category: 'drink', price: 6, stock: 35, icon: 'fa-cow' },
            { id: 19, name: '冰美式咖啡', category: 'drink', price: 10, stock: 25, icon: 'fa-mug-hot' },
            { id: 20, name: '芒果生椰拿鐵', category: 'drink', price: 15, stock: 20, icon: 'fa-wine-glass' }
        ];

        let cart = [];
        let currentLang = 'zh';

        // 渲染菜單
        function renderMenu(category = 'all') {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = '';

            const filteredItems = category === 'all' 
                ? menuData 
                : menuData.filter(item => item.category === category);

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between hover:shadow-md transition';
                card.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="p-3 bg-emerald-50 text-primary rounded-lg text-2xl flex-shrink-0">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                        <div class="flex-grow">
                            <h3 class="font-bold text-slate-800 text-base">${item.name}</h3>
                            <p class="text-xs text-slate-400 mt-0.5">每日庫存: ${item.stock} 份</p>
                            <p class="text-primary font-bold text-lg mt-2">￥${item.price}</p>
                        </div>
                    </div>
                    <button onclick="addToCart(${item.id})" class="w-full mt-3 py-2 bg-primary bg-primary-hover text-white text-sm font-semibold rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-plus text-xs"></i> 加入預訂
                    </button>
                `;
                menuGrid.appendChild(card);
            });
        }

        // 分類過濾按鈕樣式切換
        function filterCategory(cat) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.remove('bg-white', 'text-slate-600');
            event.target.classList.add('bg-primary', 'text-white');
            
            renderMenu(cat);
        }

        // 加入購物車
        function addToCart(itemId) {
            const item = menuData.find(i => i.id === itemId);
            const cartItem = cart.find(i => i.id === itemId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            updateCart();
        }

        // 更新購物車顯示
        function updateCart() {
            const cartContainer = document.getElementById('cartItems');
            const subtotalPrice = document.getElementById('subtotalPrice');
            const totalPrice = document.getElementById('totalPrice');
            const cartBadge = document.getElementById('cartBadge');

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">購物車是空的，快去挑選喜歡的餐點吧！</p>';
                subtotalPrice.innerText = '0';
                totalPrice.innerText = '0';
                cartBadge.classList.add('hidden');
                return;
            }

            cartContainer.innerHTML = '';
            let total = 0;
            let totalCount = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalCount += item.quantity;

                const div = document.createElement('div');
                div.className = 'py-2 flex items-center justify-between text-sm';
                div.innerHTML = `
                    <div class="flex-grow">
                        <p class="font-medium text-slate-800">${item.name}</p>
                        <p class="text-xs text-slate-400">￥${item.price} x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQuantity(${item.id}, -1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded flex items-center justify-center text-slate-600 text-xs font-bold">-</button>
                        <span class="font-medium text-slate-700 w-4 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity(${item.id}, 1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded flex items-center justify-center text-slate-600 text-xs font-bold">+</button>
                    </div>
                `;
                cartContainer.appendChild(div);
            });

            subtotalPrice.innerText = total;
            totalPrice.innerText = total;

            cartBadge.innerText = totalCount;
            cartBadge.classList.remove('hidden');
        }

        // 調整數量
        function changeQuantity(itemId, delta) {
            const itemIndex = cart.findIndex(i => i.id === itemId);
            if (itemIndex !== -1) {
                cart[itemIndex].quantity += delta;
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
            }
            updateCart();
        }

        // 清空購物車
        function clearCart() {
            cart = [];
            updateCart();
        }

        // 提交結帳
        function checkout() {
            if (cart.length === 0) {
                alert('您的購物車目前是空的喔！');
                return;
            }
            alert('🎉 預訂成功！請憑訂單至學校食堂取餐。');
            clearCart();
        }

        // 滾動到購物車（行動裝置適用）
        function scrollToCart() {
            document.getElementById('cartSection').scrollIntoView({ behavior: 'smooth' });
        }

        // 初始化
        renderMenu();
    </script>
</body>
</html>
